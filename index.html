<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ねばねば♡無限納豆</title>
<style>
:root{--pink:#ff67b4;--deep:#c83c86;--glass:#fff0f8e8}*{box-sizing:border-box}body{margin:0;font-family:"Yu Gothic",system-ui,sans-serif;color:#913767;background:radial-gradient(circle at 15% 20%,#fff 0 2px,transparent 3px),linear-gradient(135deg,#ffe8f3,#f6afd0 55%,#ffe4ef);background-size:65px 65px,auto}button,input{font:inherit}button{cursor:pointer}.app{max-width:1150px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}.logo{font-weight:1000;font-size:clamp(25px,4vw,40px);line-height:1.05;color:#fff;text-shadow:0 3px #ff58a8,0 0 12px #ff62b3}.logo small{display:block;font-size:12px;letter-spacing:3px;margin-top:7px}.tag{color:white;font-weight:800;text-shadow:0 1px 5px #e45b9f}.pill,.panel,.counter,.hint{background:var(--glass);border:2px solid white;box-shadow:0 8px 24px #b94c8325,inset 0 1px white;border-radius:22px}.pill{padding:10px 14px;color:var(--deep);font-weight:800}.layout{display:grid;grid-template-columns:190px minmax(0,1fr) 190px;gap:13px;align-items:start}.side{display:flex;flex-direction:column;gap:12px}.panel{padding:13px}.panel h3{font-size:15px;margin:0 0 10px;color:var(--deep)}.panel p{font-size:12px;line-height:1.6}.upload{display:block;text-align:center;border:2px dashed #ef8fbd;background:#fff8fc;border-radius:14px;padding:11px;color:var(--deep);font-weight:800}.upload input{display:none}.preview{width:100%;aspect-ratio:1.35;object-fit:cover;border-radius:12px;margin-top:9px;display:none}.small{width:100%;border:0;background:#ffe0ef;border-radius:13px;padding:9px;margin-top:8px;color:var(--deep);font-weight:800}.mixbtn{width:100%;border:0;border-radius:14px;padding:12px;background:linear-gradient(135deg,#ff7dbb,#e43b94);color:white;font-weight:900;box-shadow:0 4px #bf2d78}.stage{min-width:0}.bowlwrap{position:relative;aspect-ratio:1;min-height:310px;max-height:650px;border:8px solid #fff8fc;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse,#fff4fa 0 36%,#f6c6dc 65%,#e98ab8);box-shadow:0 18px 35px #9d3d6c30,inset 0 0 0 5px #f5bdd8;touch-action:none}.bowl{position:absolute;width:84%;height:84%;border-radius:50%;overflow:hidden;background:radial-gradient(ellipse at 35% 25%,#fff 0 4%,#f7d5e4 16%,#efb4d0 60%,#d779a5);box-shadow:inset 0 12px 25px #fff9,inset 0 -14px 25px #ad4b7c4d}.bowl:after{content:"";position:absolute;inset:2%;border:7px solid #fff9;border-radius:50%;pointer-events:none}.field{position:absolute;inset:7%;border-radius:50%;overflow:hidden;background:radial-gradient(ellipse,#9b542e,#5e321e 75%)}.bean{position:absolute;border-radius:48% 52% 43% 57%;background:radial-gradient(circle at 30% 25%,#d69a59 0 7%,#a96b37 38%,#704021 100%);box-shadow:inset -3px -4px 5px #4b291b70,inset 2px 2px 4px #fff6,0 2px 3px #371c1977}.bean:after{content:"";position:absolute;inset:18% 28% 55% 15%;border-radius:50%;background:#fff5}.photo{position:absolute;z-index:3;left:17%;top:17%;width:66%;height:66%;border-radius:45%;overflow:hidden;display:none;transform:rotate(-7deg);box-shadow:0 0 0 5px #ffd9ebaa,0 8px 22px #0002;mix-blend-mode:screen}.photo img{width:100%;height:100%;object-fit:cover}.tint{position:absolute;inset:0;background:var(--tint,#ff4fa8);mix-blend-mode:color;opacity:var(--tint-strength,0)}.photo-mosaic{position:absolute;inset:0;display:none;background-image:linear-gradient(45deg,#ff8dc6 25%,transparent 25%,transparent 75%,#ff8dc6 75%),linear-gradient(45deg,#ffb5d9 25%,#fff0f8 25%,#fff0f8 75%,#ffb5d9 75%);background-position:0 0,12px 12px;background-size:24px 24px;backdrop-filter:blur(2px);opacity:.96}.photo-mosaic span{position:absolute;inset:0;display:grid;place-items:center;color:white;font-size:20px;font-weight:900;text-shadow:0 2px 5px #b33e7a;background:#f58abc55}.strands{position:absolute;inset:0;z-index:4;pointer-events:none}.strand{position:absolute;height:var(--h);width:var(--w);left:var(--x);top:var(--y);border:3px solid var(--strand,#ff8fc6);border-color:var(--strand,#ff8fc6) transparent transparent;border-radius:50%;transform:rotate(var(--r));filter:drop-shadow(0 1px 1px #fff9);animation:stretch 2s ease-in-out infinite alternate}.hand{position:absolute;right:1%;top:-2%;font-size:clamp(44px,7vw,75px);z-index:5;transform:rotate(-18deg);filter:drop-shadow(0 5px 5px #9d3d6c55);pointer-events:none}.bowlwrap.mixing .bowl,.bowlwrap.mixing .field,.bowlwrap.mixing .photo{animation:wobble .28s linear infinite}@keyframes wobble{25%{transform:rotate(2deg) scale(1.01)}75%{transform:rotate(-2deg) scale(.99)}}@keyframes stretch{to{transform:rotate(calc(var(--r) + 8deg)) scaleY(1.1)}}.countbadge{position:absolute;right:4%;bottom:8%;z-index:6;background:#fff0f8e8;border:2px solid white;border-radius:16px;padding:7px 11px;text-align:center}.countbadge b{font-size:25px;color:#e7479b}.countbadge span{display:block;font-size:11px}.condiment{display:flex;align-items:center;gap:9px;width:100%;border:2px solid white;background:#fff4fa;border-radius:999px;padding:8px;margin:7px 0;color:#a34278;text-align:left;font-weight:800}.condiment.active{border-color:#ff58ac;box-shadow:0 0 0 3px #ffb4d8;background:#ffe0f0}.swatch{width:40px;height:40px;border-radius:50%;border:3px solid white;box-shadow:0 2px 8px #8b426326;flex:none}.condiment[data-kind=sauce] .swatch{background:radial-gradient(circle at 35% 30%,#ffb5d9,#f46ab1 55%,#bd347d)}.condiment[data-kind=mustard] .swatch{background:radial-gradient(circle at 35% 30%,#fff2a2,#f7c928 60%,#c38b12)}.condiment[data-kind=sesame] .swatch{background:radial-gradient(circle at 35% 30%,#d79a55,#95501e 60%,#5d2e16)}.condiment[data-kind=onion] .swatch{background:radial-gradient(circle at 35% 30%,#b5e78c,#56a940 60%,#287d35)}.footer{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:14px}.hint{padding:12px;text-align:center;font-weight:800;color:#c33e87}.mosaic{width:105px;aspect-ratio:1;border:5px solid white;border-radius:50%;display:grid;place-items:center;background:repeating-conic-gradient(#f78abd 0 25%,#ffcae3 0 50%) 0/24px 24px;color:white;font-weight:900;text-shadow:0 1px 4px #b33e7a}.status{text-align:center;min-height:18px;font-size:12px;color:#a43a75}@media(max-width:800px){.layout{grid-template-columns:1fr 1fr}.stage{grid-column:1/-1;grid-row:1}.left{grid-column:1;grid-row:2}.right{grid-column:2;grid-row:2}.tag{display:none}}@media(max-width:520px){.app{padding:9px}.layout{grid-template-columns:1fr}.stage,.left,.right{grid-column:1}.stage{grid-row:1}.left{grid-row:2}.right{grid-row:3}.bowlwrap{min-height:280px}.panel{padding:12px}}
</style></head><body><div class="app">
<header class="top"><div class="logo">♡ ねばねば<br>無限納豆 ♡<small>NATTO INFINITY</small></div><div class="tag">くるくる混ぜて、もっと好きになる…♡</div><button class="pill" id="sound">🔊 ねばねば音 ON</button></header>
<main class="layout">
<aside class="side left"><section class="panel"><h3>📸 写真をまぜちゃお ♡</h3><label class="upload">＋ 好きな画像を選ぶ<input id="file" type="file" accept="image/*"></label><img id="preview" class="preview" alt="画像プレビュー"><button id="remove" class="small" hidden>画像をはずす ×</button><p>画像は器の約2/3サイズ。ねばねばが上から絡まるよ♡</p></section><section class="panel"><h3>🎀 まぜまぜメニュー</h3><button id="mix" class="mixbtn">🌀 1回まぜる</button><button id="reset" class="small">♡ リセット</button><p>器の中を指やマウスでぐるぐる！</p><p>混ぜた回数：<b id="sidecount">0</b> 回</p></section></aside>
<section class="stage"><div class="bowlwrap" id="bowlwrap"><div class="bowl"><div class="field" id="field"></div><div class="photo" id="photo"><img id="inside" alt="器に入った画像"><div class="tint"></div><div class="photo-mosaic" id="photoMosaic"><span>♡ ??? ♡</span></div></div><div class="strands" id="strands"></div></div><div class="hand">🖐🏻</div><div class="countbadge"><span>♡ 混ぜた回数 ♡</span><b id="count">0</b><span>/ 1000</span></div></div><div class="status" id="status">指でくるくる円を描いて混ぜてね ♡</div></section>
<aside class="side right"><section class="panel"><h3>🧂 調味料を追加 ♡</h3><button class="condiment active" data-kind="sauce"><span class="swatch"></span><span>納豆のタレ ♡</span><span>✓</span></button><button class="condiment" data-kind="mustard"><span class="swatch"></span><span>からし ♡</span><span>○</span></button><button class="condiment" data-kind="sesame"><span class="swatch"></span><span>ごま油 ♡</span><span>○</span></button><button class="condiment" data-kind="onion"><span class="swatch"></span><span>ネギ ♡</span><span>○</span></button><p>調味料に合わせて納豆と糸の色が変わるよ♡</p></section></aside></main>
<div class="footer"><div class="hint">☝🏻 指でくるくる円を描いて混ぜてね ♡</div><div class="mosaic" id="mosaic">1000回で…♡</div></div><p class="status">写真はこのブラウザ内だけで処理され、サーバーには送信されません。</p></div>
<script>
const $=s=>document.querySelector(s),field=$("#field"),strands=$("#strands"),wrap=$("#bowlwrap");
let count=0,kind="sauce",soundOn=true,last=null,distance=0,audio=null,photoURL=null,celebrated=false,startKind="sauce";
const palette={sauce:{bean:["#f6a5cb","#e45b9f","#9c3c70"],strand:"#ff8fc6",tint:"#ff4fa8",filter:"saturate(1.1)"},mustard:{bean:["#fff09a","#f5c52e","#a77c13"],strand:"#ffe66f",tint:"#ffd21f",filter:"sepia(.4) saturate(1.3)"},sesame:{bean:["#dca064","#9b5728","#4e2b18"],strand:"#d29a61",tint:"#98501e",filter:"sepia(.5) saturate(1.2)"},onion:{bean:["#a8dc82","#58a844","#286d31"],strand:"#91d66d",tint:"#63b84c",filter:"hue-rotate(55deg) saturate(1.15)"}};
function beans(){field.innerHTML="";for(let i=0;i<56;i++){let b=document.createElement("i");b.className="bean";let a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*42;b.style.left=(50+Math.cos(a)*r-5)+"%";b.style.top=(50+Math.sin(a)*r-4)+"%";let s=6+Math.random()*7;b.style.width=s+"%";b.style.height=s*.68+"%";b.style.transform=`rotate(${Math.random()*160-80}deg)`;field.appendChild(b)}}
function threads(){strands.innerHTML="";for(let i=0;i<19;i++){let s=document.createElement("i");s.className="strand";s.style.setProperty("--x",Math.random()*80+5+"%");s.style.setProperty("--y",Math.random()*80+5+"%");s.style.setProperty("--w",15+Math.random()*55+"%");s.style.setProperty("--h",15+Math.random()*30+"%");s.style.setProperty("--r",Math.random()*150-75+"deg");s.style.animationDelay=Math.random()*-2+"s";strands.appendChild(s)}}
function apply(){
 let c=palette[kind];
 document.querySelectorAll(".condiment").forEach(b=>{let yes=b.dataset.kind===kind;b.classList.toggle("active",yes);b.lastElementChild.textContent=yes?"✓":"○"});
 // New condiment is only selected; color is revealed gradually as the user mixes.
}
function blendColor(a,b,t){
 const parse=h=>h.match(/[\da-f]{2}/gi).map(x=>parseInt(x,16));
 const A=parse(a),B=parse(b);return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("");
}
function revealColor(){
 const c=palette[kind],t=Math.min(1,count/12);
 // Start with classic brown natto, then gradually reveal the selected seasoning color.
 const base={bean:["#d69a59","#a96b37","#704021"],strand:"#d6a16d",tint:"#9b5a37"};
 const beanTop=blendColor(base.bean[0],c.bean[0],t),beanMid=blendColor(base.bean[1],c.bean[1],t),beanDark=blendColor(base.bean[2],c.bean[2],t);
 document.querySelectorAll(".bean").forEach(b=>b.style.background=`radial-gradient(circle at 30% 25%,${beanTop} 0 7%,${beanMid} 38%,${beanDark} 100%)`);
 document.querySelectorAll(".strand").forEach(s=>s.style.setProperty("--strand",blendColor(base.strand,c.strand,t)));
 field.style.filter="none";
 document.documentElement.style.setProperty("--tint",c.tint);
 document.documentElement.style.setProperty("--tint-strength",String(.05+.34*t));
}
function sound(){if(!soundOn)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();if(audio.state==="suspended")audio.resume();let t=audio.currentTime,o=audio.createOscillator(),g=audio.createGain(),f=audio.createBiquadFilter();o.type="sine";o.frequency.setValueAtTime(240,t);o.frequency.exponentialRampToValueAtTime(90,t+.13);f.type="lowpass";f.frequency.value=700;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(f);f.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.19)}catch(e){}}
function update(){
 $("#count").textContent=count;$("#sidecount").textContent=count;
 const m=$("#mosaic"),pm=$("#photoMosaic");
 if(count>=1000){
   m.textContent="♡ MAX ♡";m.style.backgroundSize="12px 12px";
   if($("#photo").style.display==="block")pm.style.display="block";
   if(!celebrated){celebrated=true;$("#status").textContent="1000回達成！ねばねばMAX♡";alert("1000回まぜまぜ達成！ねばねばMAX ♡")}
 }else{
   m.textContent="1000回で…♡";m.style.backgroundSize="24px 24px";pm.style.display="none";
 }
}
function mix(n=1){
 count=Math.min(1000,count+n);
 field.querySelectorAll(".bean").forEach(b=>{b.style.left=8+Math.random()*82+"%";b.style.top=8+Math.random()*82+"%";b.style.transform=`rotate(${Math.random()*360}deg)`});
 strands.querySelectorAll(".strand").forEach(s=>{s.style.setProperty("--x",Math.random()*75+5+"%");s.style.setProperty("--y",Math.random()*75+5+"%")});
 revealColor();update();sound();
 if(count<1000)$("#status").textContent=["ねばねば…♡","もっとぐるぐる！","色がじわじわ変わってる…♡","とろ〜り、ねばねば！"][Math.floor(Math.random()*4)]
}
function end(){wrap.classList.remove("mixing");last=null;distance=0}
wrap.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;wrap.setPointerCapture(e.pointerId);let r=wrap.getBoundingClientRect();last={x:e.clientX-r.left,y:e.clientY-r.top};wrap.classList.add("mixing")});
wrap.addEventListener("pointermove",e=>{if(!last)return;let r=wrap.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;distance+=Math.hypot(x-last.x,y-last.y);if(distance>28){let n=Math.floor(distance/28);distance-=n*28;mix(n)}last={x,y}});
wrap.addEventListener("pointerup",end);wrap.addEventListener("pointercancel",end);$("#mix").onclick=()=>mix(1);
$("#reset").onclick=()=>{count=0;celebrated=false;beans();threads();apply();revealColor();$("#photoMosaic").style.display="none";update();$("#status").textContent="リセットしたよ♡ もう一度まぜまぜ！"};
document.querySelectorAll(".condiment").forEach(b=>b.onclick=()=>{kind=b.dataset.kind;apply();$("#status").textContent="調味料を選んだよ…混ぜ終わるまで色はヒミツ♡"});
$("#file").onchange=e=>{let f=e.target.files&&e.target.files[0];if(!f)return;if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(f);$("#inside").src=photoURL;$("#preview").src=photoURL;$("#preview").style.display="block";$("#photo").style.display="block";$("#photoMosaic").style.display="none";$("#remove").hidden=false;$("#status").textContent="画像が納豆にまざったよ♡"};
$("#remove").onclick=()=>{if(photoURL)URL.revokeObjectURL(photoURL);photoURL=null;$("#inside").removeAttribute("src");$("#preview").removeAttribute("src");$("#preview").style.display="none";$("#photo").style.display="none";$("#photoMosaic").style.display="none";$("#remove").hidden=true;$("#file").value=""};
$("#sound").onclick=()=>{soundOn=!soundOn;$("#sound").textContent=soundOn?"🔊 ねばねば音 ON":"🔇 ねばねば音 OFF";$("#sound").setAttribute("aria-pressed",String(soundOn))};
beans();threads();apply();revealColor();update();
</script></body></html>
