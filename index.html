<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6efe3">
<title>無限納豆 — NATTO INFINITY</title>
<style>
  :root { --ink:#3e2b1b; --cream:#f6efe3; --card:#fffaf1; --brown:#69451f; --pink:#e8a6a0; }
  * { box-sizing:border-box }
  body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 50% 12%,#fffaf0 0,#f6efe3 48%,#e8dac4 100%); font-family: ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif; display:flex; justify-content:center; }
  main { width:min(760px,100%); padding:24px 16px 40px; text-align:center; }
  .eyebrow { font-size:12px; letter-spacing:.24em; font-weight:800; opacity:.65; }
  h1 { margin:7px 0 4px; font-size:clamp(32px,8vw,58px); letter-spacing:-.06em; line-height:1; }
  h1 span { color:#8c5b2b; }
  .sub { margin:12px 0 18px; font-size:14px; opacity:.72; }
  .scene { position:relative; width:min(520px,100%); margin:0 auto; aspect-ratio:1.1; display:grid; place-items:center; user-select:none; -webkit-user-select:none; touch-action:pan-y; }
  canvas { width:100%; height:100%; display:block; cursor:grab; touch-action:pan-y; }
  canvas:active { cursor:grabbing; }
  .steam { position:absolute; top:3%; left:50%; transform:translateX(-50%); font-size:24px; opacity:.28; pointer-events:none; letter-spacing:14px; }
  .counter { background:rgba(255,250,241,.82); border:1px solid rgba(105,69,31,.16); box-shadow:0 10px 30px #65431a12; border-radius:18px; padding:12px 18px; width:min(330px,100%); margin:-2px auto 15px; }
  .counter small { display:block; font-size:11px; letter-spacing:.15em; opacity:.65; font-weight:800; }
  .count { font-size:clamp(30px,7vw,42px); font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:-.04em; }
  .count span { font-size:13px; letter-spacing:0; opacity:.65; margin-left:4px; }
  .meter { height:7px; background:#e7d9c5; border-radius:99px; overflow:hidden; margin-top:8px; }
  .meter > div { height:100%; width:0; background:linear-gradient(90deg,#b68b45,#e2b86d,#d36f56); transition:width .15s; border-radius:99px; }
  .status { min-height:22px; font-size:13px; font-weight:700; color:#8c5b2b; margin:8px 0 14px; }
  .controls { display:flex; flex-wrap:wrap; justify-content:center; gap:9px; }
  button { border:0; border-radius:999px; padding:12px 17px; font:inherit; font-weight:800; cursor:pointer; transition:transform .12s,filter .12s; }
  button:hover { filter:brightness(1.04); transform:translateY(-1px); }
  button:active { transform:scale(.97); }
  .primary { background:#69451f; color:#fffaf1; box-shadow:0 5px 0 #4c3118; }
  .secondary { background:#fffaf1; color:#69451f; border:1px solid #d9c5a9; }
  .note { font-size:12px; line-height:1.8; opacity:.68; max-width:490px; margin:19px auto 0; }
  .tag { display:inline-block; background:#ead7bb; padding:5px 9px; border-radius:99px; font-size:10px; font-weight:900; letter-spacing:.12em; margin-bottom:7px; }
  body.glitch { animation:shake .12s infinite; filter:hue-rotate(35deg) contrast(1.15); }
  body.glitch::after { content:"NATTO ERROR // NEBA NEBA"; position:fixed; inset:0; display:grid; place-items:center; color:#fff; font-size:clamp(22px,8vw,70px); font-weight:1000; letter-spacing:-.05em; text-shadow:4px 3px #d22, -4px -3px #06c; background:#3a183333; pointer-events:none; z-index:10; animation:flash .17s steps(2) infinite; }
  @keyframes shake { 0%{transform:translate(0)} 25%{transform:translate(2px,-1px)} 50%{transform:translate(-2px,1px)} 75%{transform:translate(1px,2px)} 100%{transform:translate(0)} }
  @keyframes flash { 50%{opacity:.15; transform:translateX(5px)} }
  @media (prefers-reduced-motion:reduce) { body.glitch { animation:none } }
</style>
</head>
<body>
<main>
  <div class="eyebrow">A COMPLETELY NECESSARY WEB EXPERIENCE</div>
  <h1>無限<span>納豆</span></h1>
  <p class="sub">回しても、回しても、納豆。</p>
  <div class="scene" id="scene" aria-label="納豆を混ぜるエリア">
    <div class="steam">〰 〰 〰</div>
    <canvas id="natto" aria-label="納豆を触ると回転が加速します"></canvas>
  </div>
  <section class="counter">
    <small>累計ねりねり回転数</small>
    <div class="count" id="count">0<span>回転</span></div>
    <div class="meter"><div id="meterFill"></div></div>
  </section>
  <div class="status" id="status" aria-live="polite">納豆は今日も、回る準備ができています。</div>
  <div class="controls">
    <button class="primary" id="mix">🌀 もっと混ぜる！</button>
    <button class="secondary" id="sound">🔇 音：OFF</button>
    <button class="secondary" id="share">↗ シェア</button>
    <button class="secondary" id="reset">↻ 回転数リセット</button>
  </div>
  <p class="note">画面の納豆をドラッグしても加速するよ。音はボタンでON。<br>回しすぎると納豆の次元がちょっとだけ壊れます。<br>※回転数はこのページを開いている間だけのカウントです。</p>
  <div class="tag">NATTO NEVER ENDS</div>
</main>
<script>
(() => {
  const canvas = document.getElementById('natto');
  const ctx = canvas.getContext('2d');
  const countEl = document.getElementById('count');
  const meter = document.getElementById('meterFill');
  const status = document.getElementById('status');
  const soundBtn = document.getElementById('sound');
  let angle = 0, speed = .0035, totalTurns = 0, lastAngle = 0;
  let lastTime = performance.now(), soundOn = false, audioCtx = null, lastClick = 0;
  let dragging = false, previousPointerAngle = null, glitching = false, glitchTimer = null;
  let beans = [], strings = [];
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const w = r.width, h = r.height;
    beans = [];
    const rx = w*.29, ry = h*.27;
    for (let i=0;i<94;i++) {
      const a = Math.random()*Math.PI*2, rr = Math.sqrt(Math.random());
      beans.push({x:Math.cos(a)*rx*rr, y:Math.sin(a)*ry*rr, rot:Math.random()*Math.PI, sx:.72+Math.random()*.5, sy:.62+Math.random()*.36, shade:Math.random(), size:5+Math.random()*5});
    }
    strings = [];
    for(let i=0;i<15;i++) strings.push({a:Math.random()*Math.PI*2, r:.18+Math.random()*.75, bend:(Math.random()-.5)*.4, len:.2+Math.random()*.45});
  }
  function bean(x,y,size,rot,shade) {
    ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
    const palettes = [['#a77a36','#d7b36b','#6c451e'],['#8d6028','#c99a4d','#55351c'],['#b38a45','#e2c27a','#795020']];
    const p = palettes[Math.floor(shade*palettes.length)];
    const g = ctx.createLinearGradient(-size,-size,size,size);
    g.addColorStop(0,p[1]); g.addColorStop(.42,p[0]); g.addColorStop(1,p[2]);
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(0,0,size*1.15,size*.72,0,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#f2d69a88'; ctx.lineWidth=1; ctx.beginPath(); ctx.ellipse(-size*.22,-size*.18,size*.55,size*.18,-.2,Math.PI,Math.PI*1.8); ctx.stroke();
    ctx.restore();
  }
  function draw() {
    const w=canvas.clientWidth, h=canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    const cx=w/2, cy=h*.52, bowlRx=w*.405, bowlRy=h*.34;
    // soft shadow
    ctx.save(); ctx.fillStyle='#53371d22'; ctx.beginPath(); ctx.ellipse(cx,cy+h*.16,bowlRx*.96,bowlRy*.9,0,0,Math.PI*2); ctx.fill(); ctx.restore();
    // ceramic bowl outer body
    let g=ctx.createLinearGradient(cx-bowlRx,cy,cx+bowlRx,cy+h*.4);
    g.addColorStop(0,'#fffdf8'); g.addColorStop(.35,'#e9dfd0'); g.addColorStop(.7,'#c7b8a3'); g.addColorStop(1,'#f7f0e6');
    ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(cx-bowlRx*.98,cy); ctx.bezierCurveTo(cx-bowlRx*.83,cy+h*.39,cx+bowlRx*.83,cy+h*.39,cx+bowlRx*.98,cy); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#b7a58c'; ctx.lineWidth=2; ctx.stroke();
    // bowl interior
    const nattoRx=bowlRx*.9, nattoRy=bowlRy*.82;
    ctx.save(); ctx.beginPath(); ctx.ellipse(cx,cy,nattoRx,nattoRy,0,0,Math.PI*2); ctx.clip();
    const inside=ctx.createRadialGradient(cx-w*.07,cy-h*.12,2,cx,cy,nattoRx);
    inside.addColorStop(0,'#5d3b1c'); inside.addColorStop(.65,'#3e2817'); inside.addColorStop(1,'#1e160f');
    ctx.fillStyle=inside; ctx.fillRect(cx-nattoRx,cy-nattoRy,nattoRx*2,nattoRy*2);
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(angle);
    // sticky threads between beans
    ctx.lineCap='round';
    strings.forEach((s,i)=>{
      const a=s.a+Math.sin(angle*.7+i)*.12, rr=s.r*nattoRx;
      ctx.strokeStyle=i%3===0?'#ead5a0aa':'#d7b87a77'; ctx.lineWidth=1.2+(i%3)*.45;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*rr*.2,Math.sin(a)*rr*.2);
      ctx.bezierCurveTo(Math.cos(a+.5)*rr*.6,Math.sin(a-.4)*rr*.55,Math.cos(a+s.bend)*rr,Math.sin(a+s.bend)*rr*.8,Math.cos(a+s.len)*rr*1.08,Math.sin(a+s.len)*rr*.92); ctx.stroke();
    });
    beans.forEach(b=>bean(b.x*(nattoRx/(w*.29)),b.y*(nattoRy/(h*.27)),b.size,b.rot,b.shade));
    ctx.restore();
    // glossy highlights
    ctx.fillStyle='#fff4d622'; ctx.beginPath(); ctx.ellipse(cx-nattoRx*.24,cy-nattoRy*.55,nattoRx*.36,nattoRy*.1,-.2,0,Math.PI*2); ctx.fill();
    ctx.restore();
    // rim
    ctx.strokeStyle='#fffdf6'; ctx.lineWidth=8; ctx.beginPath(); ctx.ellipse(cx,cy,nattoRx,nattoRy,0,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#b7a58c'; ctx.lineWidth=1.4; ctx.beginPath(); ctx.ellipse(cx,cy,nattoRx,nattoRy,0,0,Math.PI*2); ctx.stroke();
    // little glint
    ctx.fillStyle='#ffffffaa'; ctx.beginPath(); ctx.ellipse(cx-nattoRx*.58,cy-nattoRy*.5,12,4,-.4,0,Math.PI*2); ctx.fill();
  }
  function updateCounter() {
    countEl.innerHTML = Math.floor(totalTurns).toLocaleString('ja-JP')+'<span>回転</span>';
    meter.style.width = (Math.min(totalTurns%100,100))+'%';
  }
  function startGlitch() {
    if(glitching) return;
    glitching=true; document.body.classList.add('glitch');
    status.textContent='⚠ 納豆の次元がバグっています。ねばねば過剰。';
    if(soundOn) beep(true);
    glitchTimer=setTimeout(()=>{document.body.classList.remove('glitch'); glitching=false; status.textContent='次元復旧。納豆は引き続き回転します。';},1800);
  }
  function beep(chaos=false) {
    try {
      audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') audioCtx.resume();
      const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
      osc.type=chaos?'sawtooth':'sine';
      osc.frequency.setValueAtTime(chaos?180:120+Math.random()*90,audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(chaos?55:75,audioCtx.currentTime+.09);
      gain.gain.setValueAtTime(.0001,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(chaos?.035:.018,audioCtx.currentTime+.01);
      gain.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+.11);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+.12);
    } catch(e) {}
  }
  function mix(boost=1) {
    speed=Math.min(speed+.035*boost,.22);
    if(soundOn) beep();
    status.textContent = speed>.15 ? '納豆が本気を出しています。' : 'ねりねり……ねばねば……';
    lastClick=performance.now();
  }
  function frame(now) {
    const dt=Math.min((now-lastTime)/16.67,3); lastTime=now;
    angle += speed*dt;
    speed = Math.max(.0035, speed*.995);
    const turns = Math.abs(angle-lastAngle)/(Math.PI*2);
    totalTurns += turns; lastAngle=angle;
    if(totalTurns>0 && Math.floor(totalTurns/80)!==Math.floor((totalTurns-turns)/80)) startGlitch();
    updateCounter(); draw();
    requestAnimationFrame(frame);
  }
  function pointerAngle(e) {
    const r=canvas.getBoundingClientRect();
    return Math.atan2(e.clientY-r.top-r.height*.52,e.clientX-r.left-r.width/2);
  }
  canvas.addEventListener('pointerdown',e=>{dragging=true; previousPointerAngle=pointerAngle(e); canvas.setPointerCapture(e.pointerId); mix(1);});
  canvas.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const a=pointerAngle(e);
    if(previousPointerAngle!==null) {
      let d=a-previousPointerAngle;
      if(d>Math.PI)d-=Math.PI*2; if(d< -Math.PI)d+=Math.PI*2;
      angle+=d*1.4; totalTurns+=Math.abs(d)/(Math.PI*2);
      speed=Math.min(speed+Math.abs(d)*.02,.22);
    }
    previousPointerAngle=a;
  });
  function endDrag(){dragging=false;previousPointerAngle=null;}
  canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',endDrag);
  document.getElementById('mix').addEventListener('click',()=>mix(1.4));
  soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'🔊 音：ON':'🔇 音：OFF'; if(soundOn)beep();});
  document.getElementById('share').addEventListener('click',async()=>{
    const text=`私は納豆を ${Math.floor(totalTurns).toLocaleString('ja-JP')} 回転させました。無限納豆、回すしかない。`;
    try { if(navigator.share) await navigator.share({title:'無限納豆',text,url:location.href}); else if(navigator.clipboard){await navigator.clipboard.writeText(text+' '+location.href);status.textContent='シェア文をコピーしたよ！';} else {prompt('コピーしてシェアしてね',text+' '+location.href);} }
    catch(e) {}
  });
  document.getElementById('reset').addEventListener('click',()=>{totalTurns=0;angle=0;lastAngle=0;speed=.0035;document.body.classList.remove('glitch');glitching=false;clearTimeout(glitchTimer);status.textContent='回転数リセット。納豆は再び無限へ。';updateCounter();});
  window.addEventListener('resize',resize);
  resize(); updateCounter(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
